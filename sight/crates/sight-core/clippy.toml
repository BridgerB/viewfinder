# Tests may unwrap: a failing unwrap is a failing test, which is what a test is for.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# The core must give the same answer for the same inputs: no clocks, no ambient randomness.
disallowed-methods = [
  { path = "std::time::Instant::now", reason = "the core reads no clock: stage timing comes from the caller's Timer" },
  { path = "std::time::SystemTime::now", reason = "the core reads no clock" },
  { path = "std::env::var", reason = "configuration is passed in as Config" },
]
