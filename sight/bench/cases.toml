# Photographs whose camera position is known, for timing the search and checking it still
# finds them. Paths are relative to the repository root. Images and skylines under data/ are
# gitignored; the Wikimedia ones are listed with their sources in static/results/LICENSE.md.
# No skyline means the tracer runs on the photograph; no fov means the lens is unknown.
# baseline_km is the search's error when this bench was set up.

[[case]]
id = "timpanogos"
image = "static/mount-timpanogos.jpg"
truth = [40.311187, -111.658619]
baseline_km = 0.15
quick = true

